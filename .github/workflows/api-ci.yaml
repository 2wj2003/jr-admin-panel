name: api-ci

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master, main, Admin-Panel-New]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yaml'
      - '.aws/api-definition.json'
  pull_request:
    branches: [master, main, Admin-Panel-New]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yaml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x]

    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: jr-commerce-api
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          cd api
          docker build -f ./Dockerfile . -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: '.aws/api-definition.json'
          container-name: app
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}
            APP_KEYS=${{ secrets.APP_KEYS }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET=jr.co.th
            AWS_REGION=ap-southeast-1
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            HOST=0.0.0.0
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MEILI_HOST=${{ secrets.MEILI_HOST }}
            MEILI_MASTER_KEY=${{ secrets.MEILI_MASTER_KEY }}
            NODE_ENV=production
            PORT=3000
            STRAPI_PREVIEW_DRAFT_URL=https://www.jr.co.th/api/preview
            STRAPI_PREVIEW_PUBLISHED_URL=https://www.jr.co.th
            STRAPI_PREVIEW_SECRET=${{ secrets.STRAPI_PREVIEW_SECRET }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: api-service
          cluster: fargate-cluster-jr-commerce-Cluster-58Pp5cyC4ksd
          wait-for-service-stability: true
